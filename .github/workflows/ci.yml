name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest

    env:
      # No DATABASE_URL / REDIS_URL on purpose: settings fall back to sqlite and
      # LocMemCache, so CI needs no service containers.
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-insecure-key-not-for-production-000000
      X_APP_KEY: ci-app-key
      # Must be non-empty: test_client_id_never_leaks_in_error asserts the id is
      # absent from error text, and `"" in anything` is always true.
      JAMENDO_CLIENT_ID: ci-dummy-client-id

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy .

      - name: Django system checks
        run: python manage.py check

      - name: Tests (pytest)
        run: pytest
